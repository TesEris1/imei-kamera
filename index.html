<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IMEI Skenavimas PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* VIRŠUTINĖ VALDYMO JUOSTA */
    .top-bar {
      flex: 0 0 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }
    
    .tool-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-btn.active {
      background: #fbbf24;
      color: #0f172a;
      border-color: #fbbf24;
    }

    .tool-btn.active-blue {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }

    /* KAMEROS KADRAS */
    .camera-container {
      flex: 1 1 auto;
      position: relative;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      touch-action: none;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.2s ease;
    }

    #video.high-contrast {
      filter: grayscale(1) contrast(1.6) brightness(0.9);
    }

    /* TAIKIKLIS */
    .target-box {
      position: absolute;
      width: 84%;
      max-width: 350px;
      height: 28%;
      border: 2px dashed rgba(59, 130, 246, 0.9);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.42);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 6px;
    }

    .target-box.barcode-found {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 9999px rgba(16, 185, 129, 0.25) !important;
    }

    .target-text {
      color: #bfdbfe;
      font-size: 11px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
    }

    /* ZOOM JUOSTA */
    .zoom-bar {
      position: absolute;
      bottom: 12px;
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 6px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .btn-zoom {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-zoom.active {
      background: #3b82f6;
      color: #fff;
    }

    /* APATINĖ JUOSTA */
    .bottom-bar {
      flex: 0 0 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .btn-capture {
      width: 100%;
      max-width: 380px;
      height: 52px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 26px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .btn-capture:active {
      transform: scale(0.97);
      background: #059669;
    }

    /* FOKUSAVIMO RATILAS */
    .focus-ring {
      position: absolute;
      width: 52px;
      height: 52px;
      border: 2px solid #fbbf24;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.4);
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
  </style>
</head>
<body>

  <!-- VIRŠUS -->
  <div class="top-bar">
    <div class="tool-group">
      <!-- Prožektorius -->
      <button id="torch-btn" class="tool-btn" onclick="toggleTorch()">
        <span class="material-symbols-outlined" style="font-size:16px;">lightbulb</span>
        <span>Šviesa</span>
      </button>

      <!-- Ekspozicijos / Atspindžių mažinimas -->
      <button id="ev-btn" class="tool-btn" onclick="toggleAntiGlare()">
        <span class="material-symbols-outlined" style="font-size:16px;">brightness_medium</span>
        <span>Atspindžiai</span>
      </button>
    </div>

    <!-- Nespalvotas filtras -->
    <div class="tool-group">
      <button id="bw-btn" class="tool-btn" onclick="toggleBW()">
        <span class="material-symbols-outlined" style="font-size:16px;">contrast</span>
        <span>B/W</span>
      </button>
    </div>
  </div>

  <!-- CENTRAS -->
  <div class="camera-container" id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    
    <div class="target-box" id="target-box">
      <div style="width:100%; display:flex; justify-content:space-between;">
        <span style="border-top: 2px solid #3b82f6; border-left: 2px solid #3b82f6; width: 14px; height: 14px;"></span>
        <span style="border-top: 2px solid #3b82f6; border-right: 2px solid #3b82f6; width: 14px; height: 14px;"></span>
      </div>
      <span class="target-text" id="target-text">Nutaikykite į IMEI kodą</span>
      <div style="width:100%; display:flex; justify-content:space-between;">
        <span style="border-bottom: 2px solid #3b82f6; border-left: 2px solid #3b82f6; width: 14px; height: 14px;"></span>
        <span style="border-bottom: 2px solid #3b82f6; border-right: 2px solid #3b82f6; width: 14px; height: 14px;"></span>
      </div>
    </div>

    <!-- Zoom mygtukai -->
    <div class="zoom-bar" id="zoom-bar" style="display:none;">
      <button class="btn-zoom active" id="zoom-1x" onclick="setZoomLevel(1, event)">1x</button>
      <button class="btn-zoom" id="zoom-2x" onclick="setZoomLevel(2, event)">2x</button>
      <button class="btn-zoom" id="zoom-3x" onclick="setZoomLevel(3, event)">3x</button>
    </div>

    <div class="focus-ring" id="focus-ring"></div>
  </div>

  <!-- APAČIA -->
  <div class="bottom-bar">
    <button class="btn-capture" onclick="takePhoto()">
      <span class="material-symbols-outlined" style="font-size:24px;">photo_camera</span>
      Fiksuoti IMEI
    </button>
  </div>

  <script>
    let track = null;
    let isTorch = false;
    let isAntiGlare = false;
    let isBW = false;
    let capabilities = {};
    let currentZoom = 1;

    // Haptinis grįžtamasis ryšys (vibracija)
    function haptic(ms = 35) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    // 1. Kameros paleidimas
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920, max: 3840 },
        height: { ideal: 1080, max: 2160 }
      }
    })
    .then(stream => {
      const video = document.getElementById('video');
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
      capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }

      if (capabilities.zoom) {
        document.getElementById('zoom-bar').style.display = 'flex';
      }

      // Paleidžiamas aparatinis brūkšninių kodų tikrinimas fone (jei palaikomas)
      startBarcodeScanner(video);
    })
    .catch(err => {
      alert("Kameros klaida: " + err.message);
    });

    // 2. Prožektoriaus valdymas
    async function toggleTorch() {
      haptic(40);
      if (!track || !capabilities.torch) {
        alert("Prožektorius nepalaikomas šioje kameroje.");
        return;
      }
      isTorch = !isTorch;
      try {
        await track.applyConstraints({ advanced: [{ torch: isTorch }] });
        document.getElementById('torch-btn').classList.toggle('active', isTorch);
      } catch (e) {
        console.warn("Torch klaida:", e);
      }
    }

    // 3. Atspindžių slopinimas (Exposure Compensation)
    async function toggleAntiGlare() {
      haptic(30);
      if (!track) return;
      isAntiGlare = !isAntiGlare;

      const btn = document.getElementById('ev-btn');
      btn.classList.toggle('active-blue', isAntiGlare);

      if (capabilities.exposureCompensation) {
        const minEv = capabilities.exposureCompensation.min || -2;
        const targetEv = isAntiGlare ? minEv * 0.65 : 0;
        try {
          await track.applyConstraints({ advanced: [{ exposureCompensation: targetEv }] });
        } catch(e) {}
      } else {
        // Programinė emuliacija, jei sensorius nepalaiko EV tiesiogiai
        document.getElementById('video').style.filter = isAntiGlare ? 'brightness(0.75) contrast(1.3)' : '';
      }
    }

    // 4. Nespalvotas filtras
    function toggleBW() {
      haptic(30);
      isBW = !isBW;
      document.getElementById('video').classList.toggle('high-contrast', isBW);
      document.getElementById('bw-btn').classList.toggle('active-blue', isBW);
    }

    // 5. Zoom valdymas mygtukais
    async function setZoomLevel(level, e) {
      if (e) e.stopPropagation();
      haptic(30);
      if (!track || !capabilities.zoom) return;

      currentZoom = Math.min(level, capabilities.zoom.max || level);
      try {
        await track.applyConstraints({ advanced: [{ zoom: currentZoom }] });
        document.querySelectorAll('.btn-zoom').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`zoom-${level}x`);
        if (activeBtn) activeBtn.classList.add('active');
      } catch (err) {}
    }

    // 6. Dviejų pirštų priartinimas (Pinch-to-zoom) ir Bakstelėjimas fokusuoti
    const container = document.getElementById('camera-container');
    let initialDist = 0;

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      } else if (e.touches.length === 1) {
        showFocusRing(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    container.addEventListener('touchmove', async (e) => {
      if (e.touches.length === 2 && track && capabilities.zoom) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const diff = (dist - initialDist) / 80;
        const maxZ = capabilities.zoom.max || 3;
        const minZ = capabilities.zoom.min || 1;
        const newZoom = Math.min(maxZ, Math.max(minZ, currentZoom + diff));

        try {
          await track.applyConstraints({ advanced: [{ zoom: newZoom }] });
          currentZoom = newZoom;
        } catch(err) {}
      }
    }, { passive: true });

    function showFocusRing(x, y) {
      haptic(20);
      const ring = document.getElementById('focus-ring');
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      ring.style.opacity = '1';
      ring.style.transform = 'translate(-50%, -50%) scale(1)';

      setTimeout(() => {
        ring.style.opacity = '0';
        ring.style.transform = 'translate(-50%, -50%) scale(1.4)';
      }, 500);

      if (track && capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }
    }

    // 7. Aparatinis brūkšninių kodų atpažinimas (BarcodeDetector API)
    function startBarcodeScanner(video) {
      if (!('BarcodeDetector' in window)) return;

      const barcodeDetector = new BarcodeDetector({
        formats: ['code_128', 'code_39', 'data_matrix', 'qr_code']
      });

      const interval = setInterval(async () => {
        if (!video.videoWidth) return;
        try {
          const barcodes = await barcodeDetector.detect(video);
          if (barcodes.length > 0) {
            const rawVal = barcodes[0].rawValue;
            const digits = rawVal.replace(/\D/g, '');
            if (digits.length === 15) {
              haptic(100);
              document.getElementById('target-box').classList.add('barcode-found');
              document.getElementById('target-text').innerText = 'Aptiktas kodas: ' + digits;
            }
          }
        } catch(e) {}
      }, 400);
    }

    // 8. Fiksavimas ir nuotraukos perdavimas
    function takePhoto() {
      haptic(60);
      const video = document.getElementById('video');
      if (!video || !video.videoWidth) return;

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL('image/jpeg', 0.95);

      if (window.opener) {
        window.opener.postMessage({ type: 'CAMERA_IMAGE', data: base64Image }, '*');
        window.close();
      } else {
        alert("Ryšio klaida su pagrindine programa.");
      }
    }
  </script>
</body>
</html>
