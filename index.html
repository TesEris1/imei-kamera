<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IMEI Skenavimas PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* 1. VIRŠUS: Valdymas */
    .top-bar {
      flex: 0 0 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .tool-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-btn.active-torch {
      background: #fbbf24;
      color: #0f172a;
      border-color: #fbbf24;
    }

    .tool-btn.active-bright {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    /* 2. CENTRAS: Kamera ir Taikiklis */
    .camera-container {
      flex: 1 1 auto;
      position: relative;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.2s ease;
    }

    .target-box {
      position: absolute;
      width: 84%;
      max-width: 350px;
      height: 28%;
      border: 2px dashed #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      z-index: 5;
      transition: border-color 0.2s ease;
    }

    .target-box.stable {
      border-color: #10b981 !important;
      border-style: solid !important;
    }

    .target-box.stable .corner {
      border-color: #10b981 !important;
    }

    .target-text {
      color: #bae6fd;
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s ease;
    }

    .target-box.stable .target-text {
      color: #34d399 !important;
    }

    .corner {
      width: 14px;
      height: 14px;
      border-color: #38bdf8;
      transition: border-color 0.2s ease;
    }

    /* ZOOM MYGTUKAI */
    .zoom-bar {
      position: absolute;
      bottom: 12px;
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 8px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .btn-zoom {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-zoom.active {
      background: #3b82f6;
      color: #fff;
    }

    /* 3. APAČIA: Mygtukas */
    .bottom-bar {
      flex: 0 0 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .btn-capture {
      width: 100%;
      max-width: 380px;
      height: 52px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 26px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .btn-capture:active {
      transform: scale(0.97);
      background: #059669;
    }

    .btn-capture.waiting {
      background: #f59e0b !important;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35) !important;
    }

    .focus-ring {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 2px solid #fbbf24;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.4);
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
      z-index: 15;
    }
  </style>
</head>
<body>

  <!-- VIRŠUS -->
  <div class="top-bar">
    <div class="tool-group">
      <button id="torch-btn" class="tool-btn" onclick="toggleTorch()">
        <span class="material-symbols-outlined" style="font-size:18px;">lightbulb</span>
        <span>Prožektorius</span>
      </button>

      <!-- PAKEISTA: Pašviesinimas tamsiems paviršiams -->
      <button id="bright-btn" class="tool-btn" onclick="toggleBrighten()">
        <span class="material-symbols-outlined" style="font-size:18px;">brightness_high</span>
        <span>Pašviesinti</span>
      </button>
    </div>
  </div>

  <!-- CENTRAS -->
  <div class="camera-container" id="camera-container" onclick="handleTapToFocus(event)">
    <video id="video" autoplay playsinline muted></video>
    
    <div class="target-box" id="target-box">
      <div style="width:100%; display:flex; justify-content:space-between;">
        <span class="corner" style="border-top: 2px solid #38bdf8; border-left: 2px solid #38bdf8;"></span>
        <span class="corner" style="border-top: 2px solid #38bdf8; border-right: 2px solid #38bdf8;"></span>
      </div>
      
      <span class="target-text" id="target-text">
        <span class="material-symbols-outlined" style="font-size:15px;">vibration</span>
        Stabilizuokite ranką...
      </span>

      <div style="width:100%; display:flex; justify-content:space-between;">
        <span class="corner" style="border-bottom: 2px solid #38bdf8; border-left: 2px solid #38bdf8;"></span>
        <span class="corner" style="border-bottom: 2px solid #38bdf8; border-right: 2px solid #38bdf8;"></span>
      </div>
    </div>

    <!-- Zoom mygtukai -->
    <div class="zoom-bar" id="zoom-bar" style="display:none;">
      <button class="btn-zoom active" id="zoom-1x" onclick="setZoom(1, event)">1x</button>
      <button class="btn-zoom" id="zoom-2x" onclick="setZoom(2, event)">2x</button>
      <button class="btn-zoom" id="zoom-3x" onclick="setZoom(3, event)">3x</button>
    </div>

    <div class="focus-ring" id="focus-ring"></div>
  </div>

  <!-- APAČIA -->
  <div class="bottom-bar">
    <button id="btn-capture" class="btn-capture" onclick="requestCapture()">
      <span class="material-symbols-outlined" style="font-size:24px;">photo_camera</span>
      <span id="capture-label">Fiksuoti IMEI</span>
    </button>
  </div>

  <script>
    let track = null;
    let capabilities = {};
    let isTorch = false;
    let isBrighten = false;

    let isStable = false;
    let stableStartTime = 0;
    let captureRequested = false;
    const MOTION_THRESHOLD = 0.55;
    const REQUIRED_STABLE_MS = 200;

    // 1. Paleidžiame kameros vaizdą Full HD raiška
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    })
    .then(stream => {
      const video = document.getElementById('video');
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
      capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }

      if (capabilities.zoom) {
        document.getElementById('zoom-bar').style.display = 'flex';
        const maxZ = capabilities.zoom.max || 1;
        if (maxZ < 2) document.getElementById('zoom-2x').style.display = 'none';
        if (maxZ < 3) document.getElementById('zoom-3x').style.display = 'none';
      }

      initStabilitySensor();
    })
    .catch(err => {
      alert("Klaida pasiekiant kamerą: " + err.message);
    });

    // 2. Akselerometras / Stabilumas
    function initStabilitySensor() {
      let lastGrav = null;

      window.addEventListener('devicemotion', (e) => {
        let mag = 0;
        if (e.acceleration && e.acceleration.x !== null) {
          mag = Math.sqrt(Math.pow(e.acceleration.x, 2) + Math.pow(e.acceleration.y, 2) + Math.pow(e.acceleration.z, 2));
        } else if (e.accelerationIncludingGravity) {
          const g = e.accelerationIncludingGravity;
          if (lastGrav) {
            mag = Math.sqrt(Math.pow(g.x - lastGrav.x, 2) + Math.pow(g.y - lastGrav.y, 2) + Math.pow(g.z - lastGrav.z, 2));
          }
          lastGrav = { x: g.x, y: g.y, z: g.z };
        }

        const now = Date.now();
        if (mag > MOTION_THRESHOLD) {
          stableStartTime = now;
          if (isStable) {
            isStable = false;
            updateStabilityUI(false);
          }
        } else {
          if (!isStable && (now - stableStartTime) >= REQUIRED_STABLE_MS) {
            isStable = true;
            updateStabilityUI(true);
            if (captureRequested) {
              captureRequested = false;
              executeCapture();
            }
          }
        }
      }, { passive: true });
    }

    function updateStabilityUI(stable) {
      const targetBox = document.getElementById('target-box');
      const targetText = document.getElementById('target-text');

      if (stable) {
        targetBox.classList.add('stable');
        targetText.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px;">check_circle</span> Paruošta (Stabilu)';
      } else {
        targetBox.classList.remove('stable');
        targetText.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px;">vibration</span> Stabilizuokite ranką...';
      }
    }

    function requestCapture() {
      if (!window.opener || window.opener.closed) {
        alert("Ryšys su pagrindine programa nutrūko. Uždarykite šį langą ir atidarykite iš naujo.");
        return;
      }

      if (isStable) {
        executeCapture();
        return;
      }

      captureRequested = true;
      const btn = document.getElementById('btn-capture');
      const label = document.getElementById('capture-label');
      btn.classList.add('waiting');
      label.innerText = 'Laukiama stabilumo...';

      setTimeout(() => {
        if (captureRequested) {
          captureRequested = false;
          executeCapture();
        }
      }, 2000);
    }

    // 3. Fiksavimas tiesiai iš ekrano (WYSWYG) + Adaptyvus ryškinimas
    async function executeCapture() {
      const btn = document.getElementById('btn-capture');
      const label = document.getElementById('capture-label');
      btn.disabled = true;
      btn.classList.remove('waiting');
      label.innerText = 'Ryškinama ir siunčiama...';

      try {
        const video = document.getElementById('video');

        // Paimamas TIKSLIAI toks vaizdas, kokį matote ekrane
        const vCanvas = document.createElement('canvas');
        vCanvas.width = video.videoWidth;
        vCanvas.height = video.videoHeight;
        const vCtx = vCanvas.getContext('2d');
        vCtx.drawImage(video, 0, 0);

        // Taikiklio koordinačių apskaičiavimas
        const targetEl = document.getElementById('target-box');
        const vRect = video.getBoundingClientRect();
        const tRect = targetEl.getBoundingClientRect();

        const imgW = vCanvas.width;
        const imgH = vCanvas.height;

        const scale = Math.max(vRect.width / imgW, vRect.height / imgH);
        const displayedW = imgW * scale;
        const displayedH = imgH * scale;

        const offsetX = (vRect.width - displayedW) / 2;
        const offsetY = (vRect.height - displayedH) / 2;

        let cropX = (tRect.left - vRect.left - offsetX) / scale;
        let cropY = (tRect.top - vRect.top - offsetY) / scale;
        let cropW = tRect.width / scale;
        let cropH = tRect.height / scale;

        const padX = cropW * 0.12;
        const padY = cropH * 0.12;

        cropX = Math.max(0, cropX - padX);
        cropY = Math.max(0, cropY - padY);
        cropW = Math.min(imgW - cropX, cropW + padX * 2);
        cropH = Math.min(imgH - cropY, cropH + padY * 2);

        // Iškerpama taikiklio sritis
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = cropW;
        cropCanvas.height = cropH;
        const cropCtx = cropCanvas.getContext('2d');

        cropCtx.drawImage(vCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        // PRAMONINIS RYŠKINIMAS: Auto-Levels + Gamma šviesinimas tamsiems paviršiams
        enhanceForDarkSurfaces(cropCtx, cropW, cropH);

        const enhancedBase64 = cropCanvas.toDataURL('image/jpeg', 0.95);

        window.opener.postMessage({ type: 'CAMERA_IMAGE', data: enhancedBase64 }, '*');
        window.close();

      } catch (err) {
        alert("Klaida apdorojant kadrą: " + err.message);
        btn.disabled = false;
        label.innerText = 'Fiksuoti IMEI';
      }
    }

    // 4. Adaptyvus histogramos ištempimas (iškelia graviruotus skaičius iš tamsaus fono)
    function enhanceForDarkSurfaces(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      let hist = new Int32Array(256);
      for (let i = 0; i < data.length; i += 4) {
        let gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
        hist[gray]++;
      }

      // Atmetame 3% kraštutinumų (prožektoriaus atspindžius ir gilius šešėlius)
      const totalPixels = data.length / 4;
      const lowBound = totalPixels * 0.03;
      const highBound = totalPixels * 0.97;

      let acc = 0;
      let minVal = 0, maxVal = 255;
      for (let i = 0; i < 256; i++) {
        acc += hist[i];
        if (acc >= lowBound && minVal === 0) minVal = i;
        if (acc >= highBound) { maxVal = i; break; }
      }
      if (maxVal <= minVal) { minVal = 0; maxVal = 255; }

      const range = maxVal - minVal;
      const lut = new Uint8Array(256);

      // Gamma 0.75 pakelia tamsius pustonius, padarydama lazerinius griovelius ryškiai baltus
      for (let i = 0; i < 256; i++) {
        let norm = Math.max(0, Math.min(255, ((i - minVal) / range) * 255));
        norm = Math.pow(norm / 255, 0.75) * 255;
        lut[i] = Math.round(norm);
      }

      for (let i = 0; i < data.length; i += 4) {
        let gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
        let val = lut[gray];
        data[i] = val;
        data[i+1] = val;
        data[i+2] = val;
      }

      ctx.putImageData(imgData, 0, 0);
    }

    // 5. Prožektoriaus valdymas
    async function toggleTorch() {
      if (!track || !capabilities.torch) {
        alert("Prožektorius nepalaikomas šioje kameroje.");
        return;
      }
      isTorch = !isTorch;
      try {
        await track.applyConstraints({ advanced: [{ torch: isTorch }] });
        document.getElementById('torch-btn').classList.toggle('active-torch', isTorch);
      } catch (e) {}
    }

    // 6. Papildomas pašviesinimas tamsiems dangteliams
    async function toggleBrighten() {
      if (!track) return;
      isBrighten = !isBrighten;

      const btn = document.getElementById('bright-btn');
      btn.classList.toggle('active-bright', isBrighten);

      if (capabilities.exposureCompensation) {
        const maxEv = capabilities.exposureCompensation.max || 2;
        const targetEv = isBrighten ? Math.min(maxEv, 1.5) : 0;
        try {
          await track.applyConstraints({ advanced: [{ exposureCompensation: targetEv }] });
        } catch(e) {}
      } else {
        document.getElementById('video').style.filter = isBrighten ? 'brightness(1.35) contrast(1.15)' : '';
      }
    }

    // 7. Zoom nustatymas
    async function setZoom(level, e) {
      if (e) e.stopPropagation();
      if (!track || !capabilities.zoom) return;

      const targetZoom = Math.min(level, capabilities.zoom.max || level);
      try {
        await track.applyConstraints({ advanced: [{ zoom: targetZoom }] });
        document.querySelectorAll('.btn-zoom').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`zoom-${level}x`);
        if (activeBtn) activeBtn.classList.add('active');
      } catch(err) {}
    }

    function handleTapToFocus(e) {
      const ring = document.getElementById('focus-ring');
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
      ring.style.opacity = '1';
      ring.style.transform = 'translate(-50%, -50%) scale(1)';

      setTimeout(() => {
        ring.style.opacity = '0';
        ring.style.transform = 'translate(-50%, -50%) scale(1.4)';
      }, 500);

      if (track && capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }
    }
  </script>
</body>
</html>
