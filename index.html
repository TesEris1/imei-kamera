<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IMEI Skenavimas PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* 1. VIRŠUS: Valdymas */
    .top-bar {
      flex: 0 0 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .tool-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-btn.active-torch {
      background: #fbbf24;
      color: #0f172a;
      border-color: #fbbf24;
    }

    .tool-btn.active-glare {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }

    /* 2. CENTRAS: Kamera ir Taikiklis */
    .camera-container {
      flex: 1 1 auto;
      position: relative;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TAIKIKLIS SU STABILUMO BŪSENOMIS */
    .target-box {
      position: absolute;
      width: 82%;
      max-width: 340px;
      height: 28%;
      border: 2px dashed #3b82f6;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      z-index: 5;
      transition: border-color 0.2s ease;
    }

    /* Kai telefonas stabilus – žalia spalva */
    .target-box.stable {
      border-color: #10b981 !important;
      border-style: solid !important;
    }

    .target-box.stable .corner {
      border-color: #10b981 !important;
    }

    .target-text {
      color: #93c5fd;
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s ease;
    }

    .target-box.stable .target-text {
      color: #34d399 !important;
    }

    .corner {
      width: 14px;
      height: 14px;
      border-color: #3b82f6;
      transition: border-color 0.2s ease;
    }

    /* ZOOM MYGTUKAI */
    .zoom-bar {
      position: absolute;
      bottom: 12px;
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 8px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .btn-zoom {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-zoom.active {
      background: #3b82f6;
      color: #fff;
    }

    /* 3. APAČIA: Mygtukas */
    .bottom-bar {
      flex: 0 0 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .btn-capture {
      width: 100%;
      max-width: 380px;
      height: 52px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 26px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .btn-capture:active {
      transform: scale(0.97);
      background: #059669;
    }

    .btn-capture.waiting {
      background: #f59e0b !important;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35) !important;
    }

    .focus-ring {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 2px solid #fbbf24;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.4);
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
      z-index: 15;
    }
  </style>
</head>
<body>

  <!-- VIRŠUS -->
  <div class="top-bar">
    <div class="tool-group">
      <button id="torch-btn" class="tool-btn" onclick="toggleTorch()">
        <span class="material-symbols-outlined" style="font-size:18px;">lightbulb</span>
        <span>Prožektorius</span>
      </button>

      <button id="glare-btn" class="tool-btn" onclick="toggleAntiGlare()">
        <span class="material-symbols-outlined" style="font-size:18px;">brightness_medium</span>
        <span>Atspindžiai</span>
      </button>
    </div>
  </div>

  <!-- CENTRAS -->
  <div class="camera-container" id="camera-container" onclick="handleTapToFocus(event)">
    <video id="video" autoplay playsinline muted></video>
    
    <!-- Taikiklis su būsenos tekstu -->
    <div class="target-box" id="target-box">
      <div style="width:100%; display:flex; justify-content:space-between;">
        <span class="corner" style="border-top: 2px solid #3b82f6; border-left: 2px solid #3b82f6;"></span>
        <span class="corner" style="border-top: 2px solid #3b82f6; border-right: 2px solid #3b82f6;"></span>
      </div>
      
      <span class="target-text" id="target-text">
        <span class="material-symbols-outlined" style="font-size:15px;">vibration</span>
        Stabilizuokite ranką...
      </span>

      <div style="width:100%; display:flex; justify-content:space-between;">
        <span class="corner" style="border-bottom: 2px solid #3b82f6; border-left: 2px solid #3b82f6;"></span>
        <span class="corner" style="border-bottom: 2px solid #3b82f6; border-right: 2px solid #3b82f6;"></span>
      </div>
    </div>

    <!-- Zoom mygtukai (1x, 2x, 3x) -->
    <div class="zoom-bar" id="zoom-bar" style="display:none;">
      <button class="btn-zoom active" id="zoom-1x" onclick="setZoom(1, event)">1x</button>
      <button class="btn-zoom" id="zoom-2x" onclick="setZoom(2, event)">2x</button>
      <button class="btn-zoom" id="zoom-3x" onclick="setZoom(3, event)">3x</button>
    </div>

    <div class="focus-ring" id="focus-ring"></div>
  </div>

  <!-- APAČIA -->
  <div class="bottom-bar">
    <button id="btn-capture" class="btn-capture" onclick="requestCapture()">
      <span class="material-symbols-outlined" style="font-size:24px;">photo_camera</span>
      <span id="capture-label">Fiksuoti IMEI</span>
    </button>
  </div>

  <script>
    let track = null;
    let imageCapture = null;
    let capabilities = {};
    let isTorch = false;
    let isAntiGlare = false;

    // DREBĖJIMO / STABILUMO KINTAMIEJI
    let isStable = false;
    let lastMotionMagnitude = 0;
    let stableStartTime = 0;
    let captureRequested = false;
    const MOTION_THRESHOLD = 0.55; // Jautrumo slenkstis (m/s²)
    const REQUIRED_STABLE_MS = 200; // Kiek ms ranka turi nejudėti

    // 1. Paleidžiame kamerą
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    })
    .then(stream => {
      const video = document.getElementById('video');
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
      capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if ('ImageCapture' in window) {
        try { imageCapture = new ImageCapture(track); } catch(e){}
      }

      if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }

      if (capabilities.zoom) {
        document.getElementById('zoom-bar').style.display = 'flex';
        const maxZ = capabilities.zoom.max || 1;
        if (maxZ < 2) document.getElementById('zoom-2x').style.display = 'none';
        if (maxZ < 3) document.getElementById('zoom-3x').style.display = 'none';
      }

      // Paleidžiame drebėjimo stebėjimą
      initStabilitySensor();
    })
    .catch(err => {
      alert("Klaida pasiekiant kamerą: " + err.message);
    });

    // 2. AKSILEROMETRO / DREBĖJIMO FILTRAS
    function initStabilitySensor() {
      let lastGrav = null;

      window.addEventListener('devicemotion', (e) => {
        let mag = 0;

        // Jei yra tikrasis akseleracijos vektorius (be gravitacijos)
        if (e.acceleration && e.acceleration.x !== null) {
          mag = Math.sqrt(
            Math.pow(e.acceleration.x, 2) +
            Math.pow(e.acceleration.y, 2) +
            Math.pow(e.acceleration.z, 2)
          );
        } else if (e.accelerationIncludingGravity) {
          // Fallback: apskaičiuojame gravitacijos vektoriaus pokyčio greitį
          const g = e.accelerationIncludingGravity;
          if (lastGrav) {
            mag = Math.sqrt(
              Math.pow(g.x - lastGrav.x, 2) +
              Math.pow(g.y - lastGrav.y, 2) +
              Math.pow(g.z - lastGrav.z, 2)
            );
          }
          lastGrav = { x: g.x, y: g.y, z: g.z };
        }

        const now = Date.now();

        // Jei viršytas judesio slenkstis – ranka virpa
        if (mag > MOTION_THRESHOLD) {
          stableStartTime = now;
          if (isStable) {
            isStable = false;
            updateStabilityUI(false);
          }
        } else {
          // Jei rami būsena trunka bent REQUIRED_STABLE_MS
          if (!isStable && (now - stableStartTime) >= REQUIRED_STABLE_MS) {
            isStable = true;
            updateStabilityUI(true);

            // Jei vartotojas jau paspaudė mygtuką ir laukia stabilaus momento
            if (captureRequested) {
              captureRequested = false;
              executeCapture();
            }
          }
        }
      }, { passive: true });
    }

    function updateStabilityUI(stable) {
      const targetBox = document.getElementById('target-box');
      const targetText = document.getElementById('target-text');

      if (stable) {
        targetBox.classList.add('stable');
        targetText.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px;">check_circle</span> Paruošta (Stabilu)';
      } else {
        targetBox.classList.remove('stable');
        targetText.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px;">vibration</span> Stabilizuokite ranką...';
      }
    }

    // 3. IŠMANUSIS MYGTUKO PASPAUDIMAS
    function requestCapture() {
      // Ryšio patikrinimas prieš pradedant
      if (!window.opener || window.opener.closed) {
        alert("Ryšys su pagrindine programa nutrūko. Uždarykite šį langą ir atidarykite iš naujo iš programos.");
        return;
      }

      // Jei ranka jau stabili – fotografuojame akimirksniu
      if (isStable) {
        executeCapture();
        return;
      }

      // Jei ranka dar virpa – laukiame stabilumo
      captureRequested = true;
      const btn = document.getElementById('btn-capture');
      const label = document.getElementById('capture-label');
      btn.classList.add('waiting');
      label.innerText = 'Laukiama stabilumo...';

      // Saugiklis: jei per 2 sekundes telefonas nesustojo, vis tiek fiksuojame
      setTimeout(() => {
        if (captureRequested) {
          captureRequested = false;
          executeCapture();
        }
      }, 2000);
    }

    // 4. KADRO FIKSAVIMAS IR APDIRBIMAS
    async function executeCapture() {
      const btn = document.getElementById('btn-capture');
      const label = document.getElementById('capture-label');
      btn.disabled = true;
      btn.classList.remove('waiting');
      label.innerText = 'Kerpama ir siunčiama...';

      try {
        let sourceImg = null;

        if (imageCapture) {
          try {
            const photoBlob = await imageCapture.takePhoto({ imageWidth: 1920, imageHeight: 1080 });
            sourceImg = await createImageBitmap(photoBlob);
          } catch(e) {
            console.warn("ImageCapture nepavyko, imamas video kadras:", e);
          }
        }

        if (!sourceImg) {
          const video = document.getElementById('video');
          const vCanvas = document.createElement('canvas');
          vCanvas.width = video.videoWidth;
          vCanvas.height = video.videoHeight;
          const vCtx = vCanvas.getContext('2d');
          vCtx.drawImage(video, 0, 0);
          sourceImg = await createImageBitmap(vCanvas);
        }

        // Taikiklio koordinačių apskaičiavimas
        const videoEl = document.getElementById('video');
        const targetEl = document.getElementById('target-box');

        const vRect = videoEl.getBoundingClientRect();
        const tRect = targetEl.getBoundingClientRect();

        const imgW = sourceImg.width;
        const imgH = sourceImg.height;

        const scale = Math.max(vRect.width / imgW, vRect.height / imgH);
        const displayedW = imgW * scale;
        const displayedH = imgH * scale;

        const offsetX = (vRect.width - displayedW) / 2;
        const offsetY = (vRect.height - displayedH) / 2;

        let cropX = (tRect.left - vRect.left - offsetX) / scale;
        let cropY = (tRect.top - vRect.top - offsetY) / scale;
        let cropW = tRect.width / scale;
        let cropH = tRect.height / scale;

        const padX = cropW * 0.15;
        const padY = cropH * 0.15;

        cropX = Math.max(0, cropX - padX);
        cropY = Math.max(0, cropY - padY);
        cropW = Math.min(imgW - cropX, cropW + padX * 2);
        cropH = Math.min(imgH - cropY, cropH + padY * 2);

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = cropW;
        cropCanvas.height = cropH;
        const cropCtx = cropCanvas.getContext('2d');

        cropCtx.drawImage(
          sourceImg,
          cropX, cropY, cropW, cropH,
          0, 0, cropW, cropH
        );

        const croppedBase64 = cropCanvas.toDataURL('image/jpeg', 0.92);

        window.opener.postMessage({ type: 'CAMERA_IMAGE', data: croppedBase64 }, '*');
        window.close();

      } catch (err) {
        alert("Klaida apdorojant kadrą: " + err.message);
        btn.disabled = false;
        label.innerText = 'Fiksuoti IMEI';
      }
    }

    // 5. Pagalbinės funkcijos (Prožektorius, Atspindžiai, Zoom, Fokusas)
    async function toggleTorch() {
      if (!track || !capabilities.torch) {
        alert("Šio įrenginio kamera nepalaiko prožektoriaus.");
        return;
      }
      isTorch = !isTorch;
      try {
        await track.applyConstraints({ advanced: [{ torch: isTorch }] });
        document.getElementById('torch-btn').classList.toggle('active-torch', isTorch);
      } catch (e) {}
    }

    async function toggleAntiGlare() {
      if (!track) return;
      isAntiGlare = !isAntiGlare;

      const btn = document.getElementById('glare-btn');
      btn.classList.toggle('active-glare', isAntiGlare);

      if (capabilities.exposureCompensation) {
        const minEv = capabilities.exposureCompensation.min || -2;
        const targetEv = isAntiGlare ? Math.max(minEv, -1.5) : 0;
        try {
          await track.applyConstraints({ advanced: [{ exposureCompensation: targetEv }] });
        } catch(e) {}
      } else {
        document.getElementById('video').style.filter = isAntiGlare ? 'brightness(0.75) contrast(1.3)' : '';
      }
    }

    async function setZoom(level, e) {
      if (e) e.stopPropagation();
      if (!track || !capabilities.zoom) return;

      const targetZoom = Math.min(level, capabilities.zoom.max || level);
      try {
        await track.applyConstraints({ advanced: [{ zoom: targetZoom }] });
        document.querySelectorAll('.btn-zoom').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`zoom-${level}x`);
        if (activeBtn) activeBtn.classList.add('active');
      } catch(err) {}
    }

    function handleTapToFocus(e) {
      const ring = document.getElementById('focus-ring');
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
      ring.style.opacity = '1';
      ring.style.transform = 'translate(-50%, -50%) scale(1)';

      setTimeout(() => {
        ring.style.opacity = '0';
        ring.style.transform = 'translate(-50%, -50%) scale(1.4)';
      }, 500);

      if (track && capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }
    }
  </script>
</body>
</html>
